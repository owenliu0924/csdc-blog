name: Sync Blogger Posts

on:
  schedule:
    # 每天執行兩次（格林威治時間 00:00 和 12:00，對應台灣時間 08:00 和 20:00）
    - cron: '0 0,12 * * *'
  workflow_dispatch: # 支援手動觸發

permissions:
  contents: write # 確保 Action 有權限 push commit 到 repo

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Blogger Sync Script
        run: node scripts/sync-blogger.js

      - name: Commit and Push if changes exist
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add src/content/posts/
          # 檢查是否有任何變更（新增、刪除或修改的 markdown 檔案）
          if ! git diff --cached --exit-code --quiet; then
            git commit -m "chore: auto-sync posts from Blogger"
            git push
          else
            echo "No changes detected. Skipping commit."
          fi
